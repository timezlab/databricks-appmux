# Build the release zip and publish it as a GitHub Release (T184, ADR 0015).
#
# A pushed tag v<version> builds the zip and publishes it; "Run workflow" (workflow_dispatch)
# builds the same zip and stops, so the zip can be checked with `unzip -l` before a tag exists.
# The workflow builds and never deploys: it holds no Databricks credential and its only secret is
# the job token GitHub gives every run.
#
# Every action is pinned by commit (the tag it was resolved from is in the comment). The release
# job is the only one that can write to the repository, and it publishes only after the build job
# passed and ADR 0015 is accepted: the zip redistributes slirp4netns under GPL-2.0-or-later, and
# that duty is the owner's to accept.
name: release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions: {}

defaults:
  run:
    shell: bash

jobs:
  build:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The tag names the version the zip will carry, so a tag that disagrees with the package is
      # refused before anything is built.
      - name: Check the tag against the package version
        id: check-tag
        if: github.event_name == 'push'
        env:
          TAG: ${{ github.ref_name }}
        run: |
          version=$(sed -n 's/^__version__ = "\(.*\)"[[:space:]]*$/\1/p' src/appmux/__init__.py)
          if [[ -z "$version" ]]; then
            echo "src/appmux/__init__.py has no __version__ = \"...\" line, so the tag cannot be checked; add it." >&2
            exit 1
          fi
          if [[ "$TAG" != "v${version}" ]]; then
            echo "The tag '${TAG}' does not match __version__ '${version}' in src/appmux/__init__.py; set __version__ to the tag without its leading v, or push the tag v${version}." >&2
            exit 1
          fi

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.11"

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22.18.0"

      - name: Install uv
        run: python -m pip install --disable-pip-version-check "uv==0.13.6"

      - name: Install the locked environment
        run: uv sync --frozen

      - name: Format check
        run: uv run --frozen ruff format --check .
      - name: Lint
        run: uv run --frozen ruff check .
      - name: Type check
        run: uv run --frozen mypy src
      - name: Unit, contract and load-generator tests
        run: uv run --frozen pytest tests/unit tests/contract tests/load

      # The wheels come from uv.lock with their hashes; the project's own environment is the
      # Python that can import `packaging`, which the script needs.
      - name: Vendor the wheels
        env:
          APPMUX_PYTHON: ${{ github.workspace }}/.venv/bin/python
        run: scripts/vendor-wheels.sh

      - name: Fetch slirp4netns with its source
        run: scripts/fetch-slirp4netns.sh

      - name: Build the admin UI
        run: web/build.sh

      - name: Assemble the zip
        run: scripts/assemble-deploy.sh --zip

      - name: List the zip
        run: |
          zips=(build/appmux-*.zip)
          if ((${#zips[@]} != 1)); then
            echo "Expected one build/appmux-*.zip, found ${#zips[@]}; scripts/assemble-deploy.sh --zip should write exactly one." >&2
            exit 1
          fi
          listing="${RUNNER_TEMP}/zip-listing.txt"
          unzip -l "${zips[0]}" > "$listing"
          cat "$listing"
          missing=0
          for entry in /app.yaml /LICENSE /requirements.txt /bin/slirp4netns /licenses/slirp4netns/COPYING /licenses/slirp4netns/SOURCE.txt /web/out/index.html; do
            if ! grep -q -- "${entry}\$" "$listing"; then
              echo "The zip has no ${entry#/}; it must not be released without it." >&2
              missing=1
            fi
          done
          exit "$missing"

      # Last, so only a zip that passed every check above can be published.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-zip
          path: |
            build/appmux-*.zip
            build/appmux-*.zip.sha256
          if-no-files-found: error
          retention-days: 14

  release:
    needs: build
    if: github.event_name == 'push'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Refuse to publish while ADR 0015 is not accepted
        id: adr-gate
        run: |
          adr=docs/decisions/0015-bundle-slirp4netns-in-the-release-zip-with-its-source.md
          if [[ ! -f "$adr" ]] || ! grep -Eq '^\*\*Status:\*\* accepted([^[:alnum:]]|$)' "$adr"; then
            echo "ADR 0015 (${adr}) is not accepted, so the zip with slirp4netns is not published. The owner accepts the duty by changing its status line to '**Status:** accepted'; a dry run (Run workflow) is unaffected." >&2
            exit 1
          fi

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-zip
          path: dist

      - name: Check the zip against its checksum
        working-directory: dist
        run: sha256sum -c -- appmux-*.zip.sha256

      - name: Write the release notes
        id: notes
        env:
          TAG: ${{ github.ref_name }}
        run: |
          slirp_version=$(sed -n 's/^readonly SLIRP4NETNS_RELEASE="\(.*\)"$/\1/p' scripts/fetch-slirp4netns.sh)
          if [[ -z "$slirp_version" ]]; then
            echo "scripts/fetch-slirp4netns.sh has no readonly SLIRP4NETNS_RELEASE line, so the notes cannot name the pinned slirp4netns; restore it." >&2
            exit 1
          fi
          cat > "${RUNNER_TEMP}/release-notes.md" << EOF
          appmux ${TAG}

          Unpack the zip and deploy the folder as it is. Check the download with \`sha256sum -c\` and the .sha256 file beside it.

          This zip redistributes slirp4netns ${slirp_version} (static x86_64 binary, \`bin/slirp4netns\`) under GPL-2.0-or-later. Its source archive and licence text are in \`licenses/slirp4netns/\` inside the zip. The static binary also contains glibc, glib and libseccomp (LGPL-2.1); \`licenses/slirp4netns/SOURCE.txt\` holds a written offer, valid for three years, for their source. The reasoning is in ADR 0015 (\`docs/decisions/\`).
          EOF

      - name: Publish the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          gh release create "$TAG" \
            --verify-tag \
            --title "appmux ${TAG}" \
            --notes-file "${RUNNER_TEMP}/release-notes.md" \
            dist/appmux-*.zip dist/appmux-*.zip.sha256
